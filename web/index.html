<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ระบบโรงพยาบาล - เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="auth card">
    <h2>ระบบจัดการข้อมูลโรงพยาบาล</h2>
    <form id="form">
      <label for="email">อีเมล</label><input id="email" type="email" required autocomplete="username">
      <label for="password">รหัสผ่าน</label><input id="password" type="password" required minlength="6" autocomplete="current-password">
      <div id="err" class="err" role="alert"></div>
      <div id="ok" class="ok" role="status"></div>
      <div class="row">
        <button class="primary" type="submit" id="login">เข้าสู่ระบบ</button>
        <button type="button" id="signup">สมัครสมาชิก</button>
      </div>
      <p class="hint">สมัครแล้วจะยังไม่เห็นข้อมูลจนกว่าผู้ดูแลระบบจะอนุมัติสิทธิ์ (ผูกบัญชีกับแพทย์ เภสัชกร พยาบาล หรือผู้ดูแลระบบ)</p>
    </form>
  </div>
  <script type="module">
    import { signIn, signUp } from './js/auth.js';
    const $ = (id) => document.getElementById(id);
    const show = (errText, okText) => { $('err').textContent = errText || ''; $('ok').textContent = okText || ''; };
    async function run(fn) {
      show();
      if (!$('form').reportValidity()) return;
      $('login').disabled = $('signup').disabled = true;
      try {
        const r = await fn($('email').value.trim(), $('password').value);
        if (!r.ok) return show(r.error);
        if (r.message) return show('', r.message);   // sign-up: stay on this page
        location.href = 'app.html';
      } finally { $('login').disabled = $('signup').disabled = false; }
    }
    $('form').addEventListener('submit', (e) => { e.preventDefault(); run(signIn); });
    $('signup').addEventListener('click', () => run(signUp));
  </script>
</body>
</html>
