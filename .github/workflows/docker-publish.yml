# Builds the web image and pushes it to Docker Hub, then (optionally) tells Render to redeploy.
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub → Account settings → Personal access tokens,
# Read & Write), optional RENDER_DEPLOY_HOOK_URL (Render service → Settings → Deploy Hook).
name: docker-publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, scripts/serve.mjs, scripts/write-config.mjs, Dockerfile, .dockerignore]
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Skip when Docker Hub secrets are not set
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; nothing pushed."
      - uses: actions/checkout@v4
        if: env.HAS_DOCKERHUB == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_DOCKERHUB == 'true'
        with: { node-version: 22 }
      - name: Unit tests (web + server)
        if: env.HAS_DOCKERHUB == 'true'
        run: node --test web/tests/*.test.mjs scripts/*.test.mjs
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKERHUB == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aie313-hospital-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aie313-hospital-web:${{ github.sha }}
      - name: Trigger Render deploy
        if: env.HAS_DOCKERHUB == 'true'
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" }
        run: if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Render deploy triggered"; else echo "no RENDER_DEPLOY_HOOK_URL; redeploy in Render by hand"; fi
